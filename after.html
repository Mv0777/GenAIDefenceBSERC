<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECHNOVA 2026 - Redesigned</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: radial-gradient(circle at top, #1e1b4b, #090d16); color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .hero { max-width: 760px; width: 100%; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 24px; padding: 48px 36px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); }
  h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); margin: 0 0 12px; letter-spacing: 2px; background: linear-gradient(90deg, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 28px; }
  .cta { background: linear-gradient(90deg, #38bdf8, #6366f1); color: #090d16; font-weight: 800; font-size: 1.05rem; padding: 14px 32px; border: none; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35); }
  .tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 36px; }
  .track-card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.25); padding: 20px; border-radius: 16px; font-weight: 700; font-size: 1.1rem; }
</style>
</head>
<body>
  <div class="hero">
    <h1>TECHNOVA 2026</h1>
    <p>Three days of robotics, code and music.</p>
    <button class="cta">Register now</button>
    <div class="tracks">
      <div class="track-card">Robotics</div>
      <div class="track-card">Hackathon</div>
      <div class="track-card">Music night</div>
    </div>
  </div>
</body>
</html>
